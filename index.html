<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#07070a">
<title>Nightlife Explorer</title>
<meta name="description" content="Explore the night, one city at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<style>
/* Layout: one phone-width column. The live 3D city map is the home surface (and the globe is the same map, zoomed out). Venues, events and chats slide over it. Dark by design. */
:root{
  color-scheme:dark;
  --outer:#07060b; --bg:#0b0a10; --bg-2:#100e17; --surface:#16131f; --surface-2:#1f1b2b; --line:#2c2741; --line-2:#3c3558;
  --fg:#f3f0fa; --muted:#a49eb9; --faint:#6e6886;
  --accent:#b9a2ff; --accent-ink:#170e2e; --live:#74f0b9; --live-ink:#05241a; --hot:#ff6d9b; --warm:#ffc866;
  --glass:rgba(14,12,21,.82);
  --f-display:"Syne","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.xs{width:13px;height:13px}.ic.lg{width:26px;height:26px}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pad{padding-left:16px;padding-right:16px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--f-display);font-weight:700;font-size:31px;line-height:1.04;letter-spacing:-.01em}
.h2{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.15}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;font-weight:700;font-size:14.5px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);white-space:nowrap;transition:transform .12s, background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.live{background:var(--live);color:var(--live-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.block{display:flex;width:100%}
.btn.big{min-height:54px;font-size:16px;border-radius:16px}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);flex:none;transition:transform .12s}
.round:active{transform:scale(.92)}
.round.on{color:var(--hot)}
.round.on .ic{fill:currentColor}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;flex:none;transition:background .15s,color .15s}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip.preset .ic{color:var(--warm)}
.chip.preset.on .ic{color:var(--accent-ink)}
.mtop .chip{background:var(--glass);border-color:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#d4cfe6}
.mtop .chip.on{background:var(--accent);color:var(--accent-ink)}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:flex;padding:3px;gap:3px;border-radius:13px;background:var(--surface);border:1px solid var(--line)}
.seg button{flex:1;height:36px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;padding:0 10px}
.seg button.on{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.seg.sm button{height:28px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center}
.badge:empty{display:none}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:800;color:var(--bg);background:hsl(var(--h) 72% 74%);flex:none;letter-spacing:.02em}
.av.xs{width:18px;height:18px;font-size:7.5px;box-shadow:0 0 0 2px var(--bg-2)}
.av.sm{width:26px;height:26px;font-size:9.5px}
.av.lg{width:64px;height:64px;font-size:20px}
.avs{display:inline-flex}.avs .av+.av{margin-left:-6px}
.lvl{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.lvl.quiet{background:var(--accent)}.lvl.medium{background:var(--warm)}.lvl.packed{background:var(--hot)}
.t-quiet{color:var(--accent)}.t-medium{color:var(--warm)}.t-packed{color:var(--hot)}.t-closed{color:var(--faint)}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--live);font-weight:700}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty b{color:var(--fg)}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.sec{display:grid;gap:12px;padding-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h span{font-size:12.5px;color:var(--muted)}
.photo{background-color:#1a1530;background-image:linear-gradient(135deg,#231c3d,#0f0d18);background-size:cover;background-position:50% 50%}

/* tabs + nav */
.tab{position:absolute;inset:0 0 calc(var(--nav-h) + var(--safe-b)) 0;display:none;background:var(--bg);z-index:4}
.tab.active{display:block}
.tab.scroll{overflow-y:auto}
#tab-map{inset:0;display:block;z-index:1;background:#05050a}
.phead{padding-top:calc(22px + var(--safe-t));display:grid;gap:8px}
.phead p{color:var(--muted);font-size:14px}
#nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(11,10,16,.9);border-top:1px solid rgba(255,255,255,.06);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);z-index:8;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#nav button{display:grid;justify-items:center;align-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--faint);position:relative}
#nav button .ib{position:relative;display:grid;place-items:center;width:48px;height:28px;border-radius:14px;transition:background .2s}
#nav button[aria-current="page"]{color:var(--fg)}
#nav button[aria-current="page"] .ib{background:var(--accent);color:var(--accent-ink)}
#nav .badge{top:-3px;right:4px}

/* map */
#map{position:absolute;inset:0;background:#05050a}
#map .maplibregl-canvas{outline:none}
.maplibregl-ctrl-bottom-left{bottom:calc(var(--sh) + var(--nav-h) + var(--safe-b) + 4px)!important;transition:bottom .28s}
.maplibregl-ctrl-attrib{background:rgba(11,10,16,.7)!important;color:#8a83a6!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:#a49eb9!important}
.maplibregl-ctrl-attrib-button{filter:invert(1) opacity(.6)}
.maplibregl-ctrl-attrib.maplibregl-compact{min-height:22px}
.mapfail{position:absolute;inset:auto 16px 50% 16px;transform:translateY(50%);z-index:3;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line-2);display:grid;gap:6px;text-align:center}

/* venue markers */
.vm{position:absolute;left:0;top:0;width:0;height:0;color:var(--accent);will-change:transform}
.vm::before{content:"";position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%}
.vm.medium{color:var(--warm)}.vm.packed{color:var(--hot)}.vm.closed{color:#8a84a3}
.vm-dot{position:absolute;left:calc(var(--s) / -2);top:calc(var(--s) / -2);width:var(--s);height:var(--s);border-radius:50%;background:currentColor;box-shadow:0 0 0 2.5px rgba(8,7,14,.95),0 0 22px 5px currentColor;transition:transform .25s}
.vm.closed .vm-dot{box-shadow:0 0 0 2.5px rgba(8,7,14,.95)}
.vm-ring{position:absolute;left:calc(var(--s) * -1);top:calc(var(--s) * -1);width:calc(var(--s) * 2);height:calc(var(--s) * 2);border-radius:50%;border:2px solid currentColor;opacity:0;animation:ring 2.6s ease-out infinite;animation-delay:var(--d,0s)}
.vm.closed .vm-ring,.vm.quiet .vm-ring{display:none}
.vm.sel .vm-dot{transform:scale(1.4)}
.vm.me .vm-dot{box-shadow:0 0 0 2.5px #08070e,0 0 0 5px var(--live),0 0 22px 5px currentColor}
.vm-label{position:absolute;left:calc(var(--s) / 2 + 8px);top:-15px;display:none;align-items:center;gap:7px;height:30px;padding:0 10px 0 9px;border-radius:10px;background:rgba(14,12,21,.88);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--fg);white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.vm-label b{font-size:12px;font-weight:800}
.vm-label small{font-size:11px;color:currentColor;font-weight:700;font-variant-numeric:tabular-nums}
.vm-label .avs .av{width:18px;height:18px;font-size:7px;box-shadow:0 0 0 1.5px #0e0c15}
.vm-label .youtag{color:var(--live);font-size:11px;font-weight:800}
#map.zlabels .vm-label,.vm.sel .vm-label,.vm.fr .vm-label,.vm.me .vm-label{display:flex}
.vm.sel{z-index:3}
.vm.off{display:none}
#map:not(.zcity) .vm,#map:not(.zcity) .um{visibility:hidden;pointer-events:none}
#map.zcity .cm{visibility:hidden;pointer-events:none}
@keyframes ring{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.um{position:absolute;width:0;height:0}
.um i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:#4f8dff;border:2.5px solid #fff;box-shadow:0 0 0 10px rgba(79,141,255,.18),0 2px 8px rgba(0,0,0,.5)}
.um::after{content:"";position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;background:rgba(79,141,255,.15);animation:ring 3s ease-out infinite}
/* city markers on the globe */
.cm{position:absolute;width:0;height:0}
.cm i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#d9cfff;box-shadow:0 0 10px 2px rgba(185,162,255,.7)}
.cm span{position:absolute;left:9px;top:-8px;font-family:var(--f-mono);font-size:10.5px;color:rgba(217,207,255,.75);white-space:nowrap;text-shadow:0 1px 6px #000}
.cm.on i{left:-7px;top:-7px;width:14px;height:14px;background:var(--live);box-shadow:0 0 0 3px rgba(116,240,185,.25),0 0 26px 8px rgba(116,240,185,.55)}
.cm.on::after{content:"";position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2px solid var(--live);animation:ring 2.2s ease-out infinite}
.cm.on span{left:14px;top:-15px;display:grid;font-family:var(--f-body);font-size:14px;font-weight:800;color:#fff;line-height:1.15}
.cm.on span small{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--live)}

/* city overlay UI */
.mtop{position:absolute;left:0;right:0;top:0;padding:calc(12px + var(--safe-t)) 12px 18px;display:grid;gap:10px;background:linear-gradient(rgba(5,5,10,.75),rgba(5,5,10,.35) 70%,rgba(5,5,10,0));z-index:2;transition:opacity .4s,transform .4s}
.mrow{display:flex;align-items:center;gap:8px;min-width:0}
.citybtn{display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 12px 0 10px;border-radius:14px;background:var(--glass);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-family:var(--f-display);font-weight:700;font-size:17px}
.citybtn .ic{color:var(--accent)}
.livepill{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#c9c3dd;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px #000}
.livepill i{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live);animation:blink 2s infinite;flex:none}
.livepill b{color:var(--fg)}
@keyframes blink{50%{opacity:.35}}
.avbtn{width:42px;height:42px;border-radius:50%;background:hsl(265 72% 74%);color:var(--bg);font-weight:800;font-size:13px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.search{flex:1;display:flex;align-items:center;gap:9px;height:46px;padding:0 14px;border-radius:15px;background:var(--glass);border:1px solid rgba(255,255,255,.08);color:var(--muted);min-width:0;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font-size:15px}
.search input::placeholder{color:#7d7698}
.search:focus-within{border-color:var(--line-2)}
.iconbtn{position:relative;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--glass);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);flex:none}
.ticker{height:36px;display:flex;align-items:center}
.ticker>div{display:inline-flex;align-items:center;gap:8px;max-width:100%;height:34px;padding:0 12px 0 5px;border-radius:999px;background:rgba(14,12,21,.78);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:12.5px;color:#d4cfe6;animation:tick .45s cubic-bezier(.2,.8,.2,1)}
.ticker>div>span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker b{color:#fff}
.ticker .tdot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(255,109,155,.18);color:var(--hot);flex:none}
.ticker .av{width:24px;height:24px;font-size:8.5px}
@keyframes tick{from{transform:translateY(-8px);opacity:0}}
.mctrl{position:absolute;right:12px;bottom:calc(var(--sh) + var(--nav-h) + var(--safe-b) + 14px);display:grid;gap:8px;z-index:2;transition:bottom .28s,opacity .4s}
.mctrl .round{font-family:var(--f-mono);font-size:11.5px;font-weight:600}
#compass .ic{transition:transform .1s linear}
#mpreview{position:absolute;left:12px;right:66px;bottom:calc(var(--sh) + var(--nav-h) + var(--safe-b) + 14px);z-index:2;transition:bottom .28s}
.mprev{display:flex;gap:12px;align-items:center;padding:10px;border-radius:18px;background:rgba(14,12,21,.9);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:rise .25s ease-out;width:100%;box-shadow:0 14px 34px rgba(0,0,0,.45)}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
.msheet{position:absolute;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));height:var(--sh);background:rgba(16,14,23,.97);border-top:1px solid rgba(255,255,255,.07);border-radius:22px 22px 0 0;display:flex;flex-direction:column;z-index:3;transition:height .3s cubic-bezier(.2,.8,.2,1),transform .45s cubic-bezier(.2,.8,.2,1);box-shadow:0 -18px 40px rgba(0,0,0,.4)}
.msheet.dragging{transition:none}
.handle{display:grid;place-items:center;height:22px;flex:none;touch-action:none;cursor:grab}
.handle i{width:40px;height:4px;border-radius:2px;background:var(--line-2)}
.mshead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 10px;flex:none;touch-action:none}
.mshead b{font-family:var(--f-display);font-size:18px;display:block}
.mshead span{font-size:12px;color:var(--muted)}
.mslist{flex:1;padding:0 12px 16px;display:grid;gap:8px;align-content:start}

/* globe overlay */
#globe-ui{position:absolute;inset:0;z-index:6;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .5s}
#globe-ui>*{pointer-events:auto}
.gtop{padding:calc(16px + var(--safe-t)) 18px 60px;display:grid;gap:10px;background:linear-gradient(rgba(5,5,10,.9),rgba(5,5,10,.4) 70%,rgba(5,5,10,0))}
.ghead{display:flex;align-items:center;justify-content:space-between}
.logo{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.logo svg{width:28px;height:28px}
.gtop p{color:#bdb6d3;font-size:14px;max-width:34ch}
.gbottom{padding:60px 16px calc(18px + var(--safe-b));display:grid;gap:12px;position:relative;background:linear-gradient(rgba(5,5,10,0),rgba(5,5,10,.7) 40%,rgba(5,5,10,.92))}
.cresults{position:absolute;left:16px;right:16px;bottom:calc(100% - 50px);display:grid;gap:4px;padding:6px;border-radius:16px;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.cresults:empty{display:none}
.cresults button{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:11px;font-weight:700;width:100%}
.cresults button:hover,.cresults button:focus-visible{background:var(--surface-2)}
.cresults span{font-size:12px;font-weight:600;color:var(--muted)}
.cresults .on span{color:var(--live)}
.chip.citylive{background:rgba(116,240,185,.14);color:var(--live);border-color:rgba(116,240,185,.45)}
.chip.citylive i{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live)}
.gbottom .chip:not(.citylive){background:rgba(22,19,31,.8)}
/* modes */
#app.mode-globe .mtop,#app.mode-globe .mctrl,#app.mode-globe #mpreview,#app.mode-fly .mtop,#app.mode-fly .mctrl,#app.mode-fly #mpreview{opacity:0;pointer-events:none;transform:translateY(-8px)}
#app.mode-globe .msheet,#app.mode-fly .msheet{transform:translateY(calc(100% + var(--nav-h) + 20px))}
#app.mode-globe #nav,#app.mode-fly #nav{transform:translateY(100%)}
#app:not(.mode-globe) #globe-ui{opacity:0;pointer-events:none}
#app:not(.mode-globe) #globe-ui>*{pointer-events:none}
#app.mode-globe .maplibregl-ctrl-bottom-left,#app.mode-fly .maplibregl-ctrl-bottom-left{bottom:calc(var(--safe-b) + 150px)!important}

/* venue rows */
.vrow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%;min-width:0}
.thumb{width:66px;height:66px;border-radius:12px;flex:none;position:relative;overflow:hidden}
.thumb .t360{position:absolute;left:5px;bottom:5px;font-family:var(--f-mono);font-size:8.5px;font-weight:600;padding:2px 5px;border-radius:5px;background:rgba(11,10,16,.75);color:var(--fg)}
.vmeta{flex:1;min-width:0;display:grid;gap:3px}
.vname{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vname .ic{color:var(--live)}
.vsub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vlive{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;min-width:0}
.vprice{font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);align-self:flex-start;padding-top:2px;white-space:nowrap}
.vprice.free{color:var(--live)}
.mprev .vrow{background:none;border:0;padding:0}

/* views */
.view{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.view.in{transform:none}
.view.out{transform:translateX(100%)}
.view>.scroll{flex:1}
.vtop{display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 12px 10px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.vtop .ttl{flex:1;min-width:0;display:grid}
.vtop .ttl b{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtop .ttl span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.vtop.over{position:absolute;left:0;right:0;top:0;border:0;background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0));z-index:2}
.hero{position:relative;height:300px;flex:none;overflow:hidden;background:#120f1c}
.hero .img{position:absolute;inset:-2px;background-repeat:no-repeat;background-size:auto 175%;background-position:30% 52%;filter:saturate(1.12) contrast(1.06) brightness(.82);animation:pan 34s ease-in-out infinite alternate}
@keyframes pan{from{background-position:18% 52%}to{background-position:82% 52%}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(11,10,16,.5),rgba(40,20,90,.08) 30%,rgba(11,10,16,0) 55%,var(--bg)),linear-gradient(90deg,rgba(60,30,140,.18),rgba(255,80,150,.08))}
.hero-top{position:absolute;left:12px;right:12px;top:calc(12px + var(--safe-t));display:flex;gap:8px;z-index:1}
.hero-top .sp{flex:1}
.tourbtn{position:absolute;left:16px;bottom:24px;z-index:1;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,.12);font-weight:700;font-size:13.5px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tourbtn .ic{color:var(--accent)}
.vhead{display:grid;gap:8px;padding-top:4px}
.vrate{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13px;color:var(--muted)}
.vrate .star{color:var(--warm);display:inline-flex;align-items:center;gap:4px;font-weight:700}
.vrate .star .ic{fill:currentColor;stroke:none}
.openst{font-weight:700}
.openst.on{color:var(--live)}
.qact{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qact>*{display:grid;justify-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.qact .qi{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);color:var(--accent)}
.qact .on .qi{background:var(--live);color:var(--live-ink);border-color:transparent}
.qact .saved .qi{color:var(--hot)}
.qact .saved .qi .ic{fill:currentColor}
.pstrip{display:grid;grid-template-columns:1.4fr 1fr 1fr;grid-template-rows:84px 84px;gap:6px;border-radius:16px;overflow:hidden}
.pstrip .ph{background-size:auto 260%;background-repeat:no-repeat;filter:saturate(1.1) brightness(.85);position:relative}
.pstrip .ph:first-child{grid-row:1/3;background-size:auto 180%}
.pstrip .ph span{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:8px;background:rgba(11,10,16,.75)}
.credit{font-size:11px;color:var(--faint)}
.livebox{padding:16px;display:grid;gap:12px}
.lb-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bignum{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:6px}
.lb-lvl{text-align:right;font-weight:800;font-size:15px}
.lb-lvl span{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.lb-row{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted)}
.lb-row b{color:var(--fg)}
.lb-row .ic{color:var(--accent)}
.pop{display:grid;gap:8px}
.pop-bars{display:flex;align-items:flex-end;gap:5px;height:92px;padding-top:6px}
.pop-bars div{flex:1;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:flex-end;height:100%}
.pop-bars i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:#3a3358;min-height:4px;position:relative}
.pop-bars i u{position:absolute;left:0;right:0;bottom:0;border-radius:5px 5px 2px 2px;background:var(--hot);opacity:.95}
.pop-bars .now i{background:rgba(255,109,155,.25)}
.pop-bars span{font-family:var(--f-mono);font-size:9.5px;color:var(--faint)}
.pop-bars .now span{color:var(--hot);font-weight:600}
.pop p{font-size:12.5px;color:var(--muted)}
.pop p b{color:var(--hot)}
.cin{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:rgba(116,240,185,.08);border:1px solid rgba(116,240,185,.35)}
.cin-ic{width:38px;height:38px;border-radius:50%;background:var(--live);color:var(--live-ink);display:grid;place-items:center;flex:none}
.cin .txt{flex:1;min-width:0;display:grid;gap:2px}
.cin .txt span{font-size:12.5px;color:var(--muted)}
.cin .btns{display:flex;gap:6px}
.msgprev{display:grid;gap:8px}
.mp{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.mp p{color:var(--muted)}
.mp b{color:var(--fg);font-weight:700;margin-right:6px}
.details{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.det{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:3px;min-width:0}
.det span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.det b{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.det.wide{grid-column:1/-1}
.score{display:flex;align-items:center;gap:12px;font-size:13.5px}
.score span:first-child{flex:1;color:var(--muted)}
.score .bar{width:90px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--live);border-radius:3px}
.score b{width:34px;text-align:right;font-variant-numeric:tabular-nums}
.rv{display:grid;gap:6px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rv-h{display:flex;align-items:center;gap:10px;font-size:13px}
.rv-h b{font-size:14px}
.rv-h time{margin-left:auto;color:var(--faint);font-size:12px}
.stars{color:var(--warm);display:inline-flex;gap:1px}
.stars .ic{fill:currentColor;stroke:none;width:13px;height:13px}
.stars .off{opacity:.25}
.rv p{font-size:14px;color:var(--muted);line-height:1.5}
.bigscore{display:flex;align-items:center;gap:14px}
.bigscore b{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.bigscore span{font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.erow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%}
.erow .thumb{width:58px;height:58px}

/* events */
.stick{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:14px;padding-bottom:12px;display:grid;gap:10px}
.stick .search{background:var(--surface);backdrop-filter:none}
.evgroup{display:grid;gap:12px;padding-top:12px}
.evgroup>h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;padding-top:6px}
.ecard{display:grid;width:100%;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.eart{position:relative;height:190px;background-size:auto 210%;background-repeat:no-repeat;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.eart::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(11,10,16,.15),rgba(11,10,16,.2) 40%,rgba(11,10,16,.92)),linear-gradient(120deg,hsla(var(--h),80%,50%,.35),transparent 60%)}
.eart>*{position:relative}
.eart .etitle{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1;letter-spacing:-.01em;text-transform:uppercase;max-width:14ch}
.edate{position:absolute;left:14px;top:14px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;padding:4px 8px;border-radius:7px;background:rgba(11,10,16,.72)}
.elive{position:absolute;right:14px;top:14px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:4px 9px;border-radius:7px;background:var(--live);color:var(--live-ink)}
.elive i{width:6px;height:6px;border-radius:50%;background:var(--live-ink);animation:blink 1.6s infinite}
.ebody{display:grid;gap:6px;padding:12px 14px 14px}
.ebody .sub{font-size:13px;color:var(--muted)}
.einfo{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:10.5px;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);letter-spacing:.04em}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.note .ic{color:var(--accent)}
.lineup{display:grid;gap:8px}
.lineup div{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.lineup .ic{color:var(--accent)}

/* chats */
.citycard{display:grid;gap:12px;padding:18px;border-radius:20px;width:100%;background:radial-gradient(120% 140% at 100% 0%,rgba(185,162,255,.22),transparent 60%),var(--surface);border:1px solid var(--line-2)}
.citycard .top{display:flex;justify-content:space-between;align-items:center}
.online{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--live);font-weight:700}
.online i{width:7px;height:7px;border-radius:50%;background:var(--live)}
.citycard .last{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.crow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%;min-width:0}
.crow .thumb{width:52px;height:52px}
.crow .vmeta span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 8px;border-radius:7px;white-space:nowrap;flex:none}
.pill.w{background:rgba(116,240,185,.12);color:var(--live)}
.pill.r{background:var(--surface-2);color:var(--faint)}
.chatlist{padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.daysep{align-self:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:4px 0}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%;text-align:left;animation:rise .25s ease-out}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:9px 12px 10px;border-radius:16px 16px 16px 6px;background:var(--surface-2);border:1px solid var(--line);display:grid;gap:3px;min-width:0}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-color:transparent;border-radius:16px 16px 6px 16px}
.mhead{display:flex;align-items:center;gap:7px;font-size:11.5px}
.mhead b{font-size:12.5px}
.mhead em{font-style:normal;font-size:10px;font-weight:800;color:var(--live);border:1px solid rgba(116,240,185,.4);padding:0 5px;border-radius:5px}
.msg.me .mhead em{color:var(--accent-ink);border-color:rgba(23,14,46,.35)}
.mhead time{color:var(--faint);font-family:var(--f-mono);font-size:10.5px}
.msg.me .mhead time{color:rgba(23,14,46,.6)}
.bubble p{font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}
.typing{align-self:flex-start;display:flex;gap:4px;padding:10px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.composer-slot{flex:none;border-top:1px solid var(--line);background:var(--bg-2);padding:10px 12px calc(10px + var(--safe-b))}
.composer{display:flex;gap:8px}
.composer input{flex:1;min-width:0;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px;outline:0;font-size:16px}
.composer input:focus{border-color:var(--line-2)}
.sendbtn{width:46px;height:46px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.locked{display:flex;align-items:center;gap:12px}
.locked>.ic{color:var(--faint)}
.locked div{flex:1;min-width:0;display:grid;font-size:12.5px;color:var(--muted)}
.locked b{color:var(--fg);font-size:14px}

/* friends + profile */
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%;min-width:0}
.prow .vmeta span{font-size:12.5px;color:var(--muted)}
.prow .btns{display:flex;gap:6px;flex:none}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addrow .btn .ic{color:var(--accent)}
.feed{display:grid;gap:0;border-radius:16px;border:1px solid var(--line);overflow:hidden}
.feed div{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);font-size:13.5px}
.feed div+div{border-top:1px solid var(--line)}
.feed time{margin-left:auto;font-size:12px;color:var(--faint);white-space:nowrap}
.feed p{color:var(--muted);min-width:0}
.feed p b{color:var(--fg)}
.me-card{display:flex;align-items:center;gap:14px;padding:calc(18px + var(--safe-t)) 0 4px}
.me-card .nm{display:grid;gap:2px}
.me-card .nm b{font-family:var(--f-display);font-size:26px;line-height:1.05}
.me-card .nm span{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;gap:2px}
.stats b{font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.setting{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.setting .txt{flex:1;min-width:0;display:grid;gap:2px}
.setting .txt span{font-size:12.5px;color:var(--muted)}
.setting>.ic{color:var(--accent)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--surface-2);border:1px solid var(--line-2);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent-ink)}
.foot{padding:30px 16px 40px;text-align:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);line-height:1.8}

/* sheets */
.sheetwrap{position:absolute;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgba(4,3,8,.6);opacity:0;transition:opacity .25s;width:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--bg-2);border-top:1px solid var(--line-2);border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
.sheetwrap.in .scrim{opacity:1}
.sheetwrap.in .sheet{transform:none}
.sheet-grab{flex:none;height:20px;display:grid;place-items:center}
.sheet-grab::after{content:"";width:40px;height:4px;border-radius:2px;background:var(--line-2)}
.sheet-body{padding:4px 16px 20px;display:grid;gap:14px;align-content:start}
.sheet-body h3{font-family:var(--f-display);font-size:22px;font-weight:700;line-height:1.15}
.sheet-body>p{color:var(--muted);font-size:14px}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sh-head .round{background:var(--surface-2)}
.sh-ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center}
.sh-ic.ok{background:var(--live);color:var(--live-ink)}
.sh-ic.warn{background:rgba(255,200,102,.14);color:var(--warm)}
.fsec{display:grid;gap:10px}
.fsec .eyebrow{display:flex;justify-content:space-between}
.sheet-foot{position:sticky;bottom:-20px;margin:0 -16px -20px;padding:12px 16px 16px;background:var(--bg-2);border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-foot .btn.primary{flex:1}
.presetrow{display:flex;gap:8px}
.presetrow input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;outline:0;font-size:16px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px;color:var(--muted)}
.ticks li{display:flex;gap:10px;align-items:center}
.ticks .ic{color:var(--live)}
.rules{counter-reset:r;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{counter-increment:r;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:14px;color:var(--muted)}
.rules li::before{content:counter(r);font-family:var(--f-mono);font-size:12px;color:var(--accent);width:28px;height:28px;border-radius:9px;border:1px solid var(--line-2);display:grid;place-items:center}
.rules b{color:var(--fg)}
.locating{display:grid;justify-items:center;gap:10px;padding:26px 0 30px;text-align:center}
.locating p{color:var(--muted);font-size:14px}
.radar{position:relative;width:84px;height:84px;margin-bottom:6px}
.radar::before{content:"";position:absolute;inset:34px;border-radius:50%;background:var(--live);box-shadow:0 0 18px var(--live)}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--live);opacity:0;animation:ring 1.8s ease-out infinite}
.radar i+i{animation-delay:.9s}
.qrbox{background:#fff;border-radius:20px;padding:14px;width:min(240px,70%);justify-self:center;aspect-ratio:1}
.qrbox svg{width:100%;height:100%;display:block}
.handle-row{display:flex;justify-content:center;align-items:center;gap:10px}
.scanner{position:relative;justify-self:center;width:min(240px,72%);aspect-ratio:1;border-radius:24px;background:radial-gradient(circle at 50% 50%,#1b1730,#0d0b14);overflow:hidden;border:1px solid var(--line-2)}
.scanner::before{content:"";position:absolute;inset:22px;border:2px dashed rgba(185,162,255,.35);border-radius:16px}
.scanner i{position:absolute;left:22px;right:22px;height:2px;background:var(--live);box-shadow:0 0 14px var(--live);animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:24px}to{top:calc(100% - 26px)}}
.found{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line-2)}
.found .vmeta span{font-size:12.5px;color:var(--muted)}
.starpick{display:flex;gap:6px}
.starpick button{color:var(--warm)}
.starpick .ic{width:34px;height:34px;stroke-width:1.4}
.starpick button.on .ic{fill:currentColor}
textarea.rvtext{width:100%;min-height:110px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);padding:12px 14px;outline:0;resize:vertical;font-size:16px}

 if(F.price==='100'&&v.entry>100)return false;
 const ages=F.door.filter(d=>/^\d+$/.test(d));
 if(ages.length&&!ages.includes(String(v.age)))return false;
 if(F.door.includes('noface')&&v.face)return false;

 return true;

 map=new maplibregl.Map({container:'map',style:mapStyle(),center:start.center,zoom:start.zoom,pitch:start.pitch,bearing:start.bearing,minZoom:1.2,maxZoom:19.5,maxPitch:72,attributionControl:false,fadeDuration:200});
 map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-left');
 const collapseAttr=()=>{const a=$('.maplibregl-ctrl-attrib');if(a)a.classList.remove('maplibregl-compact-show');};
 map.on('load',collapseAttr);map.once('idle',collapseAttr);setTimeout(collapseAttr,1500);
 let errs=0;map.on('error',e=>{errs++;if(errs===1)console.warn('map error',e&&e.error&&e.error.message);});

 addMarkers();
 let started=false;
 const begin=()=>{if(started)return;started=true;refreshMapData();if(S.acted)return;
  if(S.city){setMode('city');map.easeTo(Object.assign({},CITY_VIEW,{duration:reduced?0:2600,easing:t=>1-Math.pow(1-t,3)}));}
  else{setMode('globe');spin();}};
 map.on('load',begin);setTimeout(()=>{if(!started){begin();toast('The map is loading slowly on this connection');}},9000);
 map.on('zoom',zoomClasses);map.on('rotate',()=>{const b=map.getBearing();$('#compass .ic').style.transform=`rotate(${-b}deg)`;});
 map.on('pitchend',()=>{$('#pitchbtn').textContent=map.getPitch()>10?'2D':'3D';});
 map.on('click',e=>{const t=e.originalEvent&&e.originalEvent.target;if(t&&t.closest&&t.closest('.vm,.cm'))return;if(S.sel){S.sel=null;updateMarkers();renderPreview();}});
 ['mousedown','touchstart','wheel'].forEach(ev=>map.on(ev,()=>{S.userTouched=Date.now();}));
 map.on('moveend',()=>{if(S.mode==='globe')setTimeout(spin,Math.max(0,3500-(Date.now()-(S.userTouched||0))));});
 zoomClasses();
}
function zoomClasses(){if(!map)return;const z=map.getZoom(),el=$('#map');el.classList.toggle('zcity',z>=10.5);el.classList.toggle('zlabels',z>=15.6);}
function spin(){

const VMSTATE=['quiet','medium','packed','closed','sel','me','fr','off'];
function updateMarkers(){
 if(!map||!MK.velvet)return;
 for(const v of VENUES){
  const el=MK[v.id].getElement(),lv=level(v),fr=friendsAt(v),me=hereMe(v),n=liveCount(v),sz=lv==='closed'?11:12+Math.min(12,Math.round(n/22));
  VMSTATE.forEach(c=>el.classList.remove(c));el.classList.add(lv);if(S.sel===v.id)el.classList.add('sel');if(me)el.classList.add('me');if(fr.length)el.classList.add('fr');if(!match(v))el.classList.add('off');
  el.style.setProperty('--s',sz+'px');
  $('.vm-label',el).innerHTML=`<b>${esc(v.name)}</b><small>${lv==='closed'?esc(openLabel(v)):n+' inside'}</small>${avs(fr)}${me?'<span class="youtag">you</span>':''}`;
 }
 $$('.cmcount').forEach(e=>e.textContent=nf(citySum())+' out now');
 if(userMk)userMk.setLngLat([S.pos.lng,S.pos.lat]);

function heatData(){
 const f=[],R=Math.random;
 const pt=(lat,lng,w)=>f.push({type:'Feature',properties:{w},geometry:{type:'Point',coordinates:[lng,lat]}});
 for(const v of VENUES){if(!isOpen(v))continue;const n=Math.round(liveCount(v)/2.2);
  for(let i=0;i<n;i++){const r=Math.sqrt(-2*Math.log(R()+1e-9))*(14+R()*14),a=R()*Math.PI*2;pt(v.lat+r*Math.sin(a)/111000,v.lng+r*Math.cos(a)/94300,1);}}
 const open=VENUES.filter(isOpen);
 for(let i=0;i<170;i++){const a=pick(open),b=pick(open);if(dist(a,b)>2600)continue;const t=R();pt(a.lat+(b.lat-a.lat)*t+(R()-.5)*.0005,a.lng+(b.lng-a.lng)*t+(R()-.5)*.0005,.3);}
 return{type:'FeatureCollection',features:f};
}
function glowData(){const col={quiet:'#8f6dff',medium:'#ffb347',packed:'#ff4f8f'};return{type:'FeatureCollection',features:VENUES.filter(v=>isOpen(v)&&match(v)).map(v=>({type:'Feature',properties:{c:col[level(v)]},geometry:{type:'Point',coordinates:[v.lng,v.lat]}}))};}

 'preset-save':()=>{const i=$('#presetname'),n=(i&&i.value||'').trim();if(!n){toast('Give the preset a name');return;}S.presets.push({name:n.slice(0,24),F:clone(S.draft)});S.savingPreset=false;save();renderSheet();renderQuick();toast(`Saved "${n}". It's now a chip on the map.`);},
 'preset-del':t=>{S.presets.splice(+t.dataset.i,1);save();renderSheet();renderQuick();},
 sort:t=>{S.sort=t.dataset.k;renderList();},
 pin:t=>{const id=t.dataset.id;if(S.sel===id){openView('venue',{id});return;}S.sel=id;updateMarkers();renderPreview();flyToVenue(VBY[id]);},
 north:()=>{map&&map.easeTo({bearing:0,duration:600});},
 pitch:()=>{if(!map)return;const p=map.getPitch()>10?0:60;map.easeTo({pitch:p,duration:700});},
 locate:()=>{map&&map.easeTo({center:[S.pos.lng,S.pos.lat],zoom:16.3,pitch:55,duration:900});},
 friendmap:t=>{const v=VBY[t.dataset.id];setTab('map');S.sel=v.id;updateMarkers();renderPreview();flyToVenue(v);},
 venue:t=>openView('venue',{id:t.dataset.id}),
 event:t=>openView('event',{id:t.dataset.id}),
 chat:t=>openView('chat',{room:t.dataset.room}),
 back:()=>closeView(),
 tour:t=>openView('viewer',{id:t.dataset.id,zone:t.dataset.zone||'pano'}),
 zone:t=>{const vw=VIEWS[VIEWS.length-1];if(vw&&vw.type==='viewer')VDEF.viewer.show(vw,t.dataset.z);},
 save:t=>{const id=t.dataset.id;toggle(S.saved,id);save();refresh();toast(S.saved.includes(id)?'Saved to your places':'Removed from saved places');},
 share:t=>{const v=VBY[t.dataset.id];copyText(`${v.name}, ${v.addr}, on nightlife.explorer`,'Link copied');},
 'share-ev':t=>{const e=EBY[t.dataset.id];copyText(`${e.title} at ${VBY[e.v].name}, ${dayLabel(e.day)} ${fmtMin(e.start)}`,'Event copied');},
 checkin:t=>startCheckin(t.dataset.id),
 'ci-vis':t=>{SH.p.vis=t.dataset.v;renderSheet();},
 'ci-teleport':()=>{const v=VBY[SH.p.id];S.pos={lat:v.lat-.00022,lng:v.lng+.00012};save();SH.p.step='confirm';renderSheet();renderMapUI();},
 'ci-confirm':()=>{const p=SH.p;S.checkin={v:p.id,at:Date.now(),vis:p.vis};S.history.unshift({v:p.id,at:Date.now()});save();closeSheet();refresh();toast(`Checked in at ${VBY[p.id].name}. The venue chat is open for you.`);},
 endcheckin:()=>{S.checkin=null;save();refresh();toast('Check-in ended');},
 vis:()=>openSheet('vis'),
 setvis:t=>{if(S.checkin)S.checkin.vis=t.dataset.v;save();closeSheet();refresh();toast(`Now visible to ${VIS[t.dataset.v].toLowerCase()}`);},
 shareloc:()=>openSheet('shareloc'),
 'shareloc-to':t=>{closeSheet();toast(`${first(t.dataset.u)} can see where you are until ${fmtMin(nowMin()+120)}`);},
 rules:()=>openSheet('rules'),
 msg:t=>openSheet('msg',{u:t.dataset.u}),
 report:()=>{closeSheet();toast('Reported. A moderator will review it.');},
 block:t=>{const id=t.dataset.u;if(!S.blocked.includes(id))S.blocked.push(id);save();closeSheet();refresh();toast(`${first(id)} is blocked. Their messages are hidden.`);},
 unblockall:()=>{S.blocked=[];save();refresh();toast('Everyone unblocked');},
 addfriend:t=>sendRequest(t.dataset.u),
 accept:t=>{const id=t.dataset.u;S.requests=S.requests.filter(x=>x!==id);if(!S.friends.includes(id))S.friends.push(id);save();refresh();toast(`You and ${first(id)} are now friends`);},
 decline:t=>{S.requests=S.requests.filter(x=>x!==t.dataset.u);save();refresh();},
 myqr:()=>openSheet('qr'),
 scan:()=>openSheet('scan',{}),
 review:t=>openSheet('review',{id:t.dataset.id,stars:5,text:''}),
 'rv-star':t=>{const a=$('#rvtext');if(a)SH.p.text=a.value;SH.p.stars=+t.dataset.n;renderSheet();},
 'rv-send':()=>{const a=$('#rvtext'),text=(a&&a.value||'').trim();if(text.length<4){toast('Write a few words first');return;}const id=SH.p.id;(S.reviews[id]=S.reviews[id]||[]).unshift({n:'Alex M.',ini:'AM',h:265,s:SH.p.stars,when:'just now',t:text.slice(0,400)});save();closeSheet();refresh();toast('Review posted with a Verified visit badge');},
 defvis:t=>{S.vis=t.dataset.v;S.invisible=t.dataset.v==='me';save();renderProfile();},
 invisible:()=>{S.invisible=!S.invisible;save();renderProfile();toast(S.invisible?'Invisible mode on':'Invisible mode off');},
 resetask:()=>openSheet('reset'),
 'reset-yes':()=>{store.clear();location.reload();},
 copy:t=>copyText(t.dataset.text,t.dataset.msg),
 tickets:()=>toast('Ticket checkout comes with the real app. This demo shows the flow only.'),
 evdate:t=>{S.evDate=t.dataset.k;renderEvents();},
 evfree:()=>{S.evFree=!S.evFree;renderEvents();},
 evfriends:()=>{S.evFriends=!S.evFriends;renderEvents();},
 evgenre:t=>{toggle(S.F.genres,t.dataset.k);save();renderEvents();renderMapUI();},
 'sheet-close':()=>closeSheet()
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){e.preventDefault&&t.tagName!=='A'&&e.preventDefault();f(t,e);}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.input;if(!k)return;const v=e.target.value;
 if(k==='vsearch'){S.q=v.trim();S.sel=null;updateMarkers();renderList();renderPreview();if(map&&map.getSource('glow'))map.getSource('glow').setData(glowData());}
 else if(k==='evsearch'){S.evQ=v;renderEvList();}
 else if(k==='fsearch'){S.fq=v;renderFResults();}
 else if(k==='csearch'){const q=v.trim().toLowerCase();$('#cresults').innerHTML=q?CITIES.filter(c=>c.n.toLowerCase().includes(q)).slice(0,5).map(c=>`<button class="${c.on?'on':''}" data-act="city" data-c="${esc(c.n)}">${esc(c.n)}<span>${c.on?'Live now':'Coming soon'}</span></button>`).join('')||'<button disabled>No city found<span></span></button>':'';}
});
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset)return;e.preventDefault();
 if(f.dataset.form==='send')sendMessage(f);
 if(f.dataset.form==='csearch'){const q=$('#csearch').value.trim().toLowerCase();const c=CITIES.find(x=>x.n.toLowerCase().includes(q));if(q&&c){$('#csearch').blur();pickCity(c.n);}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(SH)closeSheet();else if(VIEWS.length)closeView();}});
window.addEventListener('resize',()=>{if(S.sheetFull)setSheet();});
setInterval(()=>{const had=!!S.checkin;activeCheckin();if(had&&!S.checkin){refresh();return;}$$('[data-cd]').forEach(el=>{el.textContent=fmtDur(+el.dataset.cd-Date.now());});},30000);

/* ================= boot ================= */
S.useGps=/[?&]gps=1/.test(location.search);
renderNav();bindSheet();setSheet();renderMapUI();
setMode(S.city?'fly':'globe');
initMap();
setInterval(liveTick,4500);setTimeout(liveTick,1500);
})();
</script>
</body>
</html>
